import groovy.json.JsonOutput
import java.nio.file.Files
import java.nio.file.LinkOption
import java.nio.file.attribute.BasicFileAttributes
import java.security.MessageDigest
import java.time.Instant
import org.gradle.api.GradleException
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ModuleComponentSelector
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentSelector
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

// External init script: no dependency/configuration changes, producer tasks or source queries.
class AureliaInventoryRefused extends RuntimeException {
    final String code
    AureliaInventoryRefused(String code) { super(code); this.code = code }
}

class AureliaRuntimeInventory {
    static final int MAX_MODULES = 300
    static final int MAX_PROJECTS = 32
    static final int MAX_ARTIFACTS = 600
    static final int MAX_EDGES = 3000
    static final int MAX_ERRORS = 100
    static final int MAX_JSON_BYTES = 4 * 1024 * 1024
    static final long MAX_ARTIFACT_BYTES = 128L * 1024 * 1024
    static final long MAX_TOTAL_ARTIFACT_BYTES = 512L * 1024 * 1024
    static final String MARKER = 'AURELIA_RUNTIME_INVENTORY:'

    static String label(Object raw, boolean empty = false) {
        String value = raw == null ? '' : raw.toString()
        if ((!empty && !value) || value.length() > 256 ||
            !(value ==~ /[A-Za-z0-9_.+@,()\[\] $-]*/) || value.contains('@')) {
            throw new AureliaInventoryRefused('unsafe-metadata-value')
        }
        return value
    }

    static String projectPath(Object raw) {
        String value = raw.toString()
        if (value.length() > 256 || !(value ==~ /:(?:[A-Za-z0-9_.-]+(?::[A-Za-z0-9_.-]+)*)?/)) {
            throw new AureliaInventoryRefused('unsupported-project-identity')
        }
        return value
    }

    static Map identity(Object identifier) {
        if (identifier instanceof ModuleComponentIdentifier) {
            String group = label(identifier.group), name = label(identifier.module), version = label(identifier.version)
            return [kind: 'module', id: "${group}:${name}:${version}".toString(), group: group, name: name, version: version]
        }
        if (identifier instanceof ProjectComponentIdentifier) {
            String path = projectPath(identifier.projectPath)
            return [kind: 'project', id: "project${path}".toString(), path: path, projectArtifact: 'not-built']
        }
        throw new AureliaInventoryRefused('unsupported-runtime-component')
    }

    static Map selector(Object requested) {
        if (requested instanceof ModuleComponentSelector) {
            return [kind: 'module', group: label(requested.group), name: label(requested.module), version: label(requested.version, true)]
        }
        if (requested instanceof ProjectComponentSelector) {
            return [kind: 'project', path: projectPath(requested.projectPath)]
        }
        throw new AureliaInventoryRefused('unsupported-dependency-selector')
    }

    static Map attributes(Object container) {
        def keys = container.keySet().sort { it.name }
        if (keys.size() > 32) throw new AureliaInventoryRefused('attribute-count-limit')
        return keys.collectEntries { key -> [(label(key.name)): label(container.getAttribute(key))] }
    }

    static List variants(Object component) {
        if (component.variants.size() > 32) throw new AureliaInventoryRefused('variant-count-limit')
        return component.variants.collect { variant -> [attributes: attributes(variant.attributes)] }
            .sort { JsonOutput.toJson(it) }
    }

    static boolean flag(Object project, String name) {
        String value = (project.findProperty(name) ?: 'false').toString()
        if (!(value in ['true', 'false'])) throw new AureliaInventoryRefused('noncanonical-build-flag')
        return value == 'true'
    }

    static void problem(Map report, String code, Throwable failure = null) {
        if (report.errors.size() < MAX_ERRORS) {
            report.errors << [code: code, errorClass: failure == null ? null : label(failure.class.name)]
        } else {
            report.errorsTruncated = true
        }
    }

    static Map artifact(Object resolved, Map budget) {
        String component = identity(resolved.id.componentIdentifier).id
        String filename = label(resolved.file.name)
        Map variantAttributes = attributes(resolved.variant.attributes)
        def path = resolved.file.toPath()
        def before = Files.readAttributes(path, BasicFileAttributes, LinkOption.NOFOLLOW_LINKS)
        long expected = before.size()
        if (!before.isRegularFile() || expected > MAX_ARTIFACT_BYTES || expected > MAX_TOTAL_ARTIFACT_BYTES - budget.used) {
            throw new AureliaInventoryRefused('artifact-byte-or-file-limit')
        }
        // Reserve each attempt before I/O; a failed read must not refund the cap.
        budget.used += expected
        def digest = MessageDigest.getInstance('SHA-256')
        long bytes = 0
        Files.newInputStream(path, LinkOption.NOFOLLOW_LINKS).withCloseable { input ->
            byte[] buffer = new byte[64 * 1024]
            while (bytes < expected) {
                int count = input.read(buffer, 0, (int) Math.min((long) buffer.length, expected - bytes))
                if (count == -1) break
                if (count == 0) throw new AureliaInventoryRefused('artifact-read-stalled')
                bytes += count
                digest.update(buffer, 0, count)
            }
        }
        def after = Files.readAttributes(path, BasicFileAttributes, LinkOption.NOFOLLOW_LINKS)
        if (bytes != before.size() || before.fileKey() != after.fileKey() ||
            before.size() != after.size() || before.lastModifiedTime() != after.lastModifiedTime()) {
            throw new AureliaInventoryRefused('artifact-changed-during-read')
        }
        return [component: component, filename: filename, bytes: bytes,
                sha256: digest.digest().encodeHex().toString(),
                variantAttributes: variantAttributes]
    }

    static void emit(Map report) {
        byte[] json = JsonOutput.toJson(report).getBytes('UTF-8')
        if (json.length > MAX_JSON_BYTES) {
            report.state = 'partial'
            report.graphResolved = false
            report.artifactsVerified = false
            problem(report, 'json-byte-limit')
            report.components = []
            report.edges = []
            report.artifacts = []
            report.observedCounts = report.counts
            report.counts = [modules: 0, projects: 0, edges: 0, artifacts: 0]
            report.inventoryTruncated = true
            json = JsonOutput.toJson(report).getBytes('UTF-8')
        }
        if (json.length > MAX_JSON_BYTES) throw new GradleException('Inventory JSON limit exceeded')
        // Exactly one protocol marker, with no paths, credentials or raw failure messages.
        System.out.println(MARKER + java.util.Base64.getEncoder().encodeToString(json))
        System.out.flush()
    }

    static void capture(Object app, Object gradle) {
        Map report = [schemaVersion: 1, kind: 'aurelia-android-runtime-inventory',
            capturedAt: Instant.now().toString(), configuration: 'releaseRuntimeClasspath',
            toolchain: [:], properties: [:], state: 'partial',
            graphResolved: false, artifactsVerified: false,
            sourceClosureComplete: false, binaryReleaseReady: false,
            sourceMetadata: [status: 'not-queried'], components: [], edges: [], artifacts: [], errors: [],
            limits: [modules: MAX_MODULES, artifacts: MAX_ARTIFACTS, edges: MAX_EDGES, jsonBytes: MAX_JSON_BYTES,
                     artifactBytes: MAX_ARTIFACT_BYTES, totalArtifactBytes: MAX_TOTAL_ARTIFACT_BYTES]]
        try {
            String name = (app.findProperty('aureliaInventoryConfiguration') ?: 'releaseRuntimeClasspath').toString()
            if (!(name in ['releaseRuntimeClasspath', 'debugRuntimeClasspath'])) {
                throw new AureliaInventoryRefused('unsupported-runtime-configuration')
            }
            report.configuration = name
            report.toolchain = [gradleVersion: label(gradle.gradleVersion), javaVersion: label(System.getProperty('java.version')),
                                javaVendor: label(System.getProperty('java.vendor'))]
            report.properties = [aureliaYoutubeSource: flag(app, 'aureliaYoutubeSource'), aureliaSilentQa: flag(app, 'aureliaSilentQa')]
            def configuration = app.configurations.getByName(name)
            if (!configuration.canBeResolved) throw new AureliaInventoryRefused('configuration-not-resolvable')
            def graph = configuration.incoming.resolutionResult
            Set seen = new HashSet()
            int modules = 0, projects = 0
            graph.allComponents.each { component ->
                Map item = identity(component.id)
                if (!seen.add(item.id)) throw new AureliaInventoryRefused('duplicate-component-identity')
                if (item.kind == 'module' && ++modules > MAX_MODULES) throw new AureliaInventoryRefused('module-count-limit')
                if (item.kind == 'project' && ++projects > MAX_PROJECTS) throw new AureliaInventoryRefused('project-count-limit')
                item.variants = variants(component)
                report.components << item
            }
            graph.allDependencies.each { dependency ->
                if (report.edges.size() >= MAX_EDGES) throw new AureliaInventoryRefused('edge-count-limit')
                Map edge = [from: identity(dependency.from.id).id, requested: selector(dependency.requested)]
                if (dependency instanceof ResolvedDependencyResult) {
                    edge.selected = identity(dependency.selected.id).id
                    edge.constraint = dependency.constraint
                    edge.variantAttributes = attributes(dependency.resolvedVariant.attributes)
                } else if (dependency instanceof UnresolvedDependencyResult) {
                    edge.status = 'unresolved'
                    problem(report, 'unresolved-dependency', dependency.failure)
                } else {
                    throw new AureliaInventoryRefused('unsupported-dependency-result')
                }
                report.edges << edge
            }
            report.graphResolved = report.errors.isEmpty()
            if (report.graphResolved) {
                // Leniency exposes failures for the partial receipt; ANY failure still fails the task.
                def collection = configuration.incoming.artifactView {
                    componentFilter { identifier -> identifier instanceof ModuleComponentIdentifier }
                    lenient = true
                }.artifacts
                if (collection.failures.size() > MAX_ARTIFACTS) throw new AureliaInventoryRefused('artifact-count-limit')
                collection.failures.each { failure -> problem(report, 'artifact-resolution-failure', failure) }
                Map budget = [used: 0L]
                int attempted = collection.failures.size()
                collection.artifacts.each { resolved ->
                    if (++attempted > MAX_ARTIFACTS) throw new AureliaInventoryRefused('artifact-count-limit')
                    try {
                        Map item = artifact(resolved, budget)
                        report.artifacts << item
                    } catch (Exception failure) {
                        problem(report, failure instanceof AureliaInventoryRefused ? failure.code : 'artifact-read-failure', failure)
                    }
                }
                report.artifactsVerified = report.errors.isEmpty() && !report.artifacts.isEmpty()
                if (report.artifacts.isEmpty()) problem(report, 'no-external-runtime-artifacts')
            }
        } catch (Exception failure) {
            problem(report, failure instanceof AureliaInventoryRefused ? failure.code : 'runtime-inventory-failure', failure)
        }
        report.components.sort { it.id }
        report.edges.sort { JsonOutput.toJson(it) }
        report.artifacts.sort { "${it.component}:${it.filename}:${it.sha256}" }
        report.counts = [modules: report.components.count { it.kind == 'module' }, projects: report.components.count { it.kind == 'project' },
                         edges: report.edges.size(), artifacts: report.artifacts.size()]
        if (report.errors.isEmpty() && report.graphResolved && report.artifactsVerified) report.state = 'resolved'
        emit(report)
        if (report.state != 'resolved') throw new GradleException('Runtime inventory incomplete; inspect the captured partial report')
    }
}

gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) throw new GradleException('Inventory requires the reviewed Android app project')
    app.tasks.register('aureliaRuntimeInventory') {
        group = 'verification'
        description = 'Report the exact selected app runtime graph without building project artifacts.'
        doLast { AureliaRuntimeInventory.capture(app, gradle) }
    }
}
