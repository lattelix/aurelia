<!doctype html>
<html lang="en">
  <meta charset="UTF-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  /><meta name="theme-color" content="#171918" /><title>Aurelia · Offline</title
  ><style>
    body {
      margin: 0;
      min-height: 100dvh;
      background: #171918;
      color: #f4efe6;
      display: grid;
      place-items: center;
      font: 16px system-ui;
    }
    main {
      max-width: 400px;
      padding: 32px;
    }
    img {
      width: 70px;
    }
    h1 {
      font-size: 38px;
      letter-spacing: -1px;
    }
    p {
      color: #a8aba4;
      line-height: 1.7;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 24px;
      border-radius: 30px;
      background: #e7bb7a;
      color: #171918;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
  <main>
    <img src="/icon.svg" alt="Aurelia" />
    <h1>A quiet moment.</h1>
    <p>
      You’re offline. Your saved library is safe on the server. Reconnect to
      search, stream, and sync your music.
    </p>
    <a href="/">Try again</a>
  </main>
</html>
